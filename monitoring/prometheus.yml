global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/robotics-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: robotics-api
    static_configs:
      - targets: ["api:8080"]
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
